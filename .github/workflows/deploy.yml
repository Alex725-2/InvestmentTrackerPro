name: Deploy to VPS (PRO)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Publish Server project
      run: dotnet publish Server/InvestmentTracker.Server.csproj -c Release -o publish

    - name: Create archive
      run: tar -czf publish.tar.gz -C publish .

    - name: Copy archive to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: "publish.tar.gz"
        target: "/opt/investment-tracker-pro"

    - name: Deploy and restart service
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /opt/investment-tracker-pro
          # Удаляем все файлы, кроме базы данных
          find app -type f -not -name 'investmenttracker-pro.db' -delete 2>/dev/null || true
          # Удаляем пустые папки внутри app, но не саму app
          find app -mindepth 1 -type d -empty -delete 2>/dev/null || true
          # Гарантируем, что папка app существует
          mkdir -p app
          # Распаковываем архив
          tar -xzf publish.tar.gz -C app
          # Перезапускаем сервис
          systemctl restart investment-tracker-pro